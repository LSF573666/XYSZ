# version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  websocket:
    build: .
    command: daphne -b 0.0.0.0 -p 6000 biget.asgi:application
    volumes:
      - .:/app
    ports:
      - "6000:6000"
    environment:
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DJANGO_SETTINGS_MODULE=biget.settings
    depends_on:
      - redis
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A biget worker
      --loglevel=info
      --pool=eventlet
      --concurrency=60
      --max-tasks-per-child=100
      --without-gossip
      --without-mingle
      --without-heartbeat
      -E
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=biget.settings
      - C_FORCE_ROOT=1
    depends_on:
      - redis
      - websocket
    restart: unless-stopped
    # 资源限制修正位置（与command、volumes平级）
    mem_limit: 3G
    mem_reservation: 1G
    cpus: 2.0
    stop_grace_period: 20s

  celery_beat:
    build: .
    command: celery -A biget beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=biget.settings
    depends_on:
      - redis
    restart: unless-stopped
    # 资源限制统一格式
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 1m

  flower:
    build: .
    command: >
      celery -A biget flower
      --port=5555
      --persistent=True
      --events_poll_interval=0
      --no_events
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DJANGO_SETTINGS_MODULE=biget.settings
    depends_on:
      - redis
      - celery
    restart: unless-stopped
    # 资源限制统一格式
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis_data: